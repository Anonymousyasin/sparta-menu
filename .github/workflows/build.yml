name: Build Sparta Menu APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - name: Grant execute permission to gradlew
        run: chmod +x gradlew
      - name: Ensure gradle-wrapper.jar exists
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Wrapper jar missing — downloading Gradle 8.13 directly"
            curl -sL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/g.zip
            unzip -q /tmp/g.zip -d /opt
            echo "GRADLE_CMD=/opt/gradle-8.13/bin/gradle" >> $GITHUB_ENV
          else
            echo "GRADLE_CMD=./gradlew" >> $GITHUB_ENV
          fi
      - name: Build debug APK
        run: $GRADLE_CMD assembleDebug --no-daemon --stacktrace
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: sparta-menu-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
